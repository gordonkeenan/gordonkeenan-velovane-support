name: Close stale needs-info issues

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          only-labels: needs-info
          days-before-stale: 14
          days-before-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been waiting for more information for 14 days.
            It will be closed in 7 days unless there's a reply.
          close-issue-message: >
            Closing due to no response. Feel free to reopen with the requested details.
